<!DOCTYPE html>                     <!-- объявление типа документа HTML5 -->
<html lang="ru">                    <!-- корневой элемент, язык страницы — русский -->
<head>                              <!-- начало секции head (служебная информация) -->
    <meta charset="UTF-8">          <!-- кодировка символов UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- адаптивность под мобильные устройства -->
    <title>Flexbox Layout</title>   <!-- заголовок вкладки браузера -->
    <link rel="stylesheet" href="reset.css">    <!-- подключаем файл сброса стилей -->
    <link rel="stylesheet" href="styles.css">   <!-- подключаем основной файл стилей -->
</head>                             <!-- конец секции head -->
<body>                              <!-- начало тела документа -->

    <!-- ==================== ШАПКА ==================== -->
    <header class="header">         <!-- шапка сайта с классом header -->
        <h1>Flexbox в действии</h1> <!-- главный заголовок страницы -->
    </header>                       <!-- конец шапки -->

    <!-- ==================== ОСНОВНОЙ БЛОК ==================== -->
    <main class="main">             <!-- основной контейнер макета -->

        <!-- ========== БОКОВАЯ НАВИГАЦИЯ ========== -->
        <nav class="navigation">    <!-- навигационный блок -->
            <h2>Навигация</h2>      <!-- заголовок навигации -->
            <ul>                    <!-- маркированный список ссылок -->
                <li><a href="#">Главная</a></li>     <!-- пункт меню «Главная» -->
                <li><a href="#">О нас</a></li>       <!-- пункт меню «О нас» -->
                <li><a href="#">Услуги</a></li>      <!-- пункт меню «Услуги» -->
                <li><a href="#">Портфолио</a></li>   <!-- пункт меню «Портфолио» -->
                <li><a href="#">Контакты</a></li>    <!-- пункт меню «Контакты» -->
            </ul>                   <!-- конец списка -->
        </nav>                      <!-- конец навигации -->

        <!-- ========== КОНТЕНТ С КАРТОЧКАМИ ========== -->
        <section class="content">   <!-- секция основного контента -->
            <div class="card">                  <!-- первая карточка -->
                <h3>Карточка 1</h3>             <!-- заголовок карточки -->
                <p>Описание первой карточки</p><!-- текст карточки -->
            </div>                              <!-- конец первой карточки -->

            <div class="card">                  <!-- вторая карточка -->
                <h3>Карточка 2</h3>             <!-- заголовок карточки -->
                <p>Описание второй карточки</p><!-- текст карточки -->
            </div>                              <!-- конец второй карточки -->

            <div class="card">                    <!-- третья карточка -->
                <h3>Карточка 3</h3>               <!-- заголовок карточки -->
                <p>Описание третьей карточки</p>  <!-- текст карточки -->
            </div>                                <!-- конец третьей карточки -->
        </section>                  <!-- конец секции контента -->

        <!-- ========== БОКОВАЯ ПАНЕЛЬ ========== -->
        <aside class="sidebar">     <!-- боковая панель -->
            <h3>Боковая панель</h3> <!-- заголовок панели -->
            <p>Дополнительная информация</p>  <!-- текст панели -->
        </aside>                    <!-- конец боковой панели -->

    </main>                         <!-- конец основного блока -->

    <!-- ==================== ФУТЕР ==================== -->
    <footer class="footer">         <!-- подвал сайта -->
        <div class="footer-content">        <!-- контейнер содержимого футера -->
            <div class="footer-section">Контакты</div>   <!-- секция «Контакты» -->
            <div class="footer-section">Соцсети</div>    <!-- секция «Соцсети» -->
            <div class="footer-section">Партнеры</div>   <!-- секция «Партнеры» -->
            <div class="footer-section">Подписка</div>   <!-- секция «Подписка» -->
        </div>                              <!-- конец контейнера футера -->
    </footer>                       <!-- конец футера -->

</body>                             <!-- конец тела документа -->
</html>                             <!-- конец HTML-документа -->
